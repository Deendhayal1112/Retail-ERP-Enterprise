<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none';" />
    <title>Retail ERP Enterprise — Home</title>
    <!-- Link global styles first -->
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body
    class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen overflow-hidden"
  >
    <!-- Premium Background Glow Elements -->
    <div
      class="glow-bg absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-blue-600/10 blur-[120px] pointer-events-none"
    ></div>
    <div
      class="glow-bg absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-violet-600/10 blur-[120px] pointer-events-none"
    ></div>

    <!-- Custom Title Bar for Frame-less Window Controls consistency -->
    <header
      class="titlebar fixed top-0 left-0 w-full h-11 bg-slate-900/40 backdrop-blur-md border-b border-slate-800/40 flex items-center justify-between px-4 select-none z-50"
    >
      <div class="flex items-center gap-2">
        <!-- Premium ERP Logo Icon -->
        <svg
          class="w-5 h-5 text-blue-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
          />
        </svg>
        <span
          class="text-xs font-semibold tracking-wider text-slate-300 uppercase"
          >Retail ERP Enterprise</span
        >
      </div>

      <!-- Window Control Buttons -->
      <div class="flex items-center gap-1">
        <button
          id="win-min"
          class="win-btn hover:bg-slate-800/60"
          aria-label="Minimize Window"
        >
          <svg
            class="w-3.5 h-3.5 text-slate-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path stroke-linecap="round" d="M20 12H4" />
          </svg>
        </button>
        <button
          id="win-max"
          class="win-btn hover:bg-slate-800/60"
          aria-label="Maximize Window"
        >
          <svg
            class="w-3.5 h-3.5 text-slate-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path stroke-linecap="round" d="M4 4h16v16H4z" />
          </svg>
        </button>
        <button
          id="win-close"
          class="win-btn hover:bg-red-600/20 hover:text-red-400"
          aria-label="Close Window"
        >
          <svg
            class="w-3.5 h-3.5 text-slate-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Glassmorphic Main Layout Container -->
    <main class="w-full max-w-lg mx-4 z-10">
      <div
        class="card bg-slate-900/60 border border-slate-800/60 backdrop-blur-xl p-10 rounded-2xl shadow-2xl text-center flex flex-col items-center"
      >
        <!-- Success Badge -->
        <div
          class="success-icon-container w-20 h-20 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mb-8 relative"
        >
          <div
            class="absolute inset-0 rounded-full bg-emerald-500/20 blur-md pulse-glow"
          ></div>
          <svg
            class="w-10 h-10 text-emerald-400 relative z-10"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>

        <!-- Confirmation Headers -->
        <h1 class="text-3xl font-bold tracking-tight text-white mb-2">
          Login Successful
        </h1>
        <p class="text-sm text-slate-400 mb-8 tracking-wide">
          Session established. Offline-first local database synced.
        </p>

        <!-- Welcome Banner Card -->
        <div
          class="w-full bg-slate-950/40 border border-slate-800/40 rounded-xl p-6 mb-8 text-left"
        >
          <span
            class="text-[10px] font-semibold text-blue-500 uppercase tracking-widest block mb-1"
            >Active Operator</span
          >
          <h2 id="welcome-message" class="text-xl font-bold text-white mb-4">
            Welcome, User!
          </h2>

          <div class="grid grid-cols-2 gap-4 text-xs">
            <div>
              <span class="text-slate-500 block mb-1">System Username</span>
              <span id="meta-username" class="font-medium text-slate-300"
                >--</span
              >
            </div>
            <div>
              <span class="text-slate-500 block mb-1">Authority Role</span>
              <span id="meta-role" class="font-medium text-slate-300">--</span>
            </div>
            <div class="col-span-2">
              <span class="text-slate-500 block mb-1"
                >Security Token Identifier</span
              >
              <span
                id="meta-uuid"
                class="font-mono text-slate-400 break-all select-all"
                >--</span
              >
            </div>
          </div>
        </div>

        <!-- Logout Action Button -->
        <button
          id="logout-btn"
          class="w-full py-3.5 px-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 active:scale-[0.98] transition-all text-sm font-semibold tracking-wide text-white rounded-lg shadow-lg flex items-center justify-center gap-2 cursor-pointer"
        >
          <svg
            class="w-4 h-4 text-slate-300"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          <span>Securely End Session</span>
        </button>
      </div>
    </main>

    <script src="./home.js"></script>
  </body>
</html>
